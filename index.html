<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b2026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dummy Yard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Dummy Yard</title>
<style>
/* Layout: one-screen app — slim control bar, full-bleed physics yard, tool tray along the bottom */
:root{
  --bg:#252b33;
  --panel:#1b2026;
  --line:#323a44;
  --fg:#e8ebee;
  --muted:#8d98a3;
  --accent:#f2b544;
  --font-display:ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body:system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--panel);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  height:100%;margin:0;font-size:14px;
  background:var(--bg);color:var(--fg);font-family:var(--font-body);
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
.app{height:100%;display:flex;flex-direction:column}
.bar,.tray{
  display:flex;align-items:center;gap:8px;padding-block:6px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  background:var(--panel);
}
.bar{border-bottom:1px solid var(--line)}
.tray{border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;padding-block:8px}
.tray::-webkit-scrollbar{display:none}
.name{font:800 17px/1 var(--font-display);letter-spacing:.01em;margin-right:auto;white-space:nowrap}
.name b{color:var(--accent);font-weight:800}
.btn{
  min-width:44px;height:40px;padding:0 10px;border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:transparent;color:var(--fg);border:1px solid var(--line);
  font:600 13px/1 var(--font-body);touch-action:manipulation;cursor:pointer;
}
.btn:active{background:var(--line)}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn.warn{color:#ff8a6a;border-color:#ff8a6a}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{
  flex:0 0 auto;width:66px;padding:6px 0 5px;border-radius:10px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  background:transparent;border:1px solid transparent;color:var(--muted);
  font:600 11px/1 var(--font-body);touch-action:manipulation;cursor:pointer;
}
.chip svg{width:30px;height:30px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:#232931}
.stage{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;display:block;touch-action:none}
.tag,.toast{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none}
.tag{
  top:10px;font:800 11px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;
  background:var(--accent);color:#1d1504;padding:6px 10px;border-radius:6px;
}
.toast{
  bottom:56px;max-width:calc(100% - 32px);width:max-content;
  font:600 13px/1.3 var(--font-body);text-align:center;
  background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:8px 12px;border-radius:8px;
}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="name">Dummy <b>Yard</b></div>
    <button class="btn" id="soundBtn" aria-label="Sound"></button>
    <button class="btn" id="slowBtn" aria-label="Slow motion">1×</button>
    <button class="btn" id="pauseBtn" aria-label="Pause"></button>
    <button class="btn" id="clearBtn" aria-label="Clear the yard"></button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="tag" id="pausedTag" hidden>Paused</div>
    <div class="toast" id="toast" role="status" hidden></div>
  </div>
  <div class="tray" id="tray" role="toolbar" aria-label="Tools"></div>
</div>

<script>
(() => {
'use strict';
try{localStorage.removeItem('pocket-grains-world')}catch(e){}

const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
const COL={sky:'#252b33',grid:'#2c333c',ground:'#3b424c',groundTop:'#4a525d',
  body:'#dfe2e5',bodyBack:'#c3c8cd',outline:'#5d6670',joint:'#b5bbc2',grab:'#f2b544'};

let VW=0,VH=0,dpr=1,groundY=0;
const GROUND_H=44;
// a standing dummy is ~115 units tall; size it to about 40% of the yard's height
const scale=()=>Math.max(.8,Math.min(3.2,Math.min(VH*.4,VW*.75)/115));

// ---- Verlet physics: each dummy is points joined by sticks ----
const GRAVITY=.55,DAMP=.995,ITER=10;
const KNOCKDOWN=13; // sudden speed change (px/step) that knocks a dummy off its feet
let dummies=[];

// joint layout in body units (1 unit ≈ 1px at scale 1), hip at origin
const SKELETON={
  head:[0,-56],neck:[0,-40],hip:[0,0],
  elbowB:[3,-24],handB:[4,-8],elbowF:[-3,-24],handF:[-4,-8],
  kneeB:[4,22],footB:[5,44],kneeF:[-4,22],footF:[-5,44],
};
// The body as capsules, drawn back to front. The physics collides with exactly these
// shapes, so a hit lands where you see it. tough: how much a hit on that part hurts.
const SHAPES=[
  {a:'hip',b:'kneeB',w:8.5,back:1,tough:.8},{a:'kneeB',b:'footB',w:8.5,back:1,tough:.5},
  {a:'neck',b:'elbowB',w:7,back:1,tough:.8},{a:'elbowB',b:'handB',w:7,back:1,tough:.6},
  {a:'neck',b:'hip',w:17,tough:1},
  {a:'hip',b:'kneeF',w:8.5,tough:.8},{a:'kneeF',b:'footF',w:8.5,tough:.5},
  {a:'head',b:'head',w:20,tough:1.4},
  {a:'neck',b:'elbowF',w:7,tough:.8},{a:'elbowF',b:'handF',w:7,tough:.6},
];
for(const sh of SHAPES)sh.key=sh.a===sh.b?'head':sh.a+'-'+sh.b;
const SHAPE_BY_KEY=Object.fromEntries(SHAPES.map(sh=>[sh.key,sh]));
const PARTS=SHAPES.map(sh=>[sh.a,sh.b,sh.w]); // for picking with a finger, front-most last
// each joint is as round as the thickest part that meets there
const RADIUS={};
for(const sh of SHAPES)for(const k of [sh.a,sh.b])RADIUS[k]=Math.max(RADIUS[k]||0,sh.w/2);
const BONES=[ // [from,to] rigid
  ['head','neck'],['neck','hip'],
  ['neck','elbowB'],['elbowB','handB'],['neck','elbowF'],['elbowF','handF'],
  ['hip','kneeB'],['kneeB','footB'],['hip','kneeF'],['kneeF','footF'],
];
// helpers that keep the head on the shoulders and stop limbs folding flat
const BRACES=[['head','hip','fixed'],['hip','footB','min',.62],['hip','footF','min',.62],['neck','handB','min',.45],['neck','handF','min',.45]];

function makeDummy(x,y){
  const s=scale(),pts={};
  for(const k in SKELETON){
    const [ux,uy]=SKELETON[k];
    pts[k]={x:x+ux*s,y:y+uy*s,px:x+ux*s,py:y+uy*s,r:RADIUS[k]*s,key:k,vx:0,vy:0,hitSpeed:0,nx:0,ny:1};
  }
  const sticks=[];
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  for(const [a,b] of BONES)sticks.push({a:pts[a],b:pts[b],len:dist(pts[a],pts[b]),type:'fixed'});
  for(const [a,b,type,f] of BRACES)sticks.push({a:pts[a],b:pts[b],len:dist(pts[a],pts[b])*(f||1),type,stiff:type==='fixed'?.5:1});
  const d={pts,list:Object.values(pts),sticks,s,strength:1,recover:0,contacts:{},
    face:Math.random()<.5?-1:1,blink:rnd(60,240)};
  heal(d);
  dummies.push(d);
  return d;
}
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp01=v=>v<0?0:v>1?1:v;
// back to full health: no injuries, nothing broken
function heal(d){
  Object.assign(d,{health:100,dead:false,ko:false,spots:[],partDmg:{},legBroken:false,armBroken:{B:false,F:false},hpShow:0,hurtCool:0,lastDmg:0});
}

// ---- balance: muscles ease each joint toward its standing pose, measured from the hip ----
const MUSCLE={neck:.2,head:.2,kneeB:.12,kneeF:.12,footB:.1,footF:.1,elbowB:.04,elbowF:.04,handB:.03,handF:.03};
function pull(p,x,y,k){
  const dx=(x-p.x)*k,dy=(y-p.y)*k;
  p.x+=dx;p.y+=dy;p.px+=dx*.85;p.py+=dy*.85; // mostly a nudge, little added speed
}
function balance(d){
  const st=d.strength;if(st<=0)return;
  const P=d.pts,s=d.s,footR=P.footF.r;
  const grounded=P.footB.y>groundY-footR-3*s||P.footF.y>groundY-footR-3*s;
  if(grounded){
    // legs carry the body's weight, and push the hip up to standing height over the feet
    for(const p of d.list)if(p!==P.footB&&p!==P.footF)p.y-=GRAVITY*st;
    pull(P.hip,(P.footB.x+P.footF.x)/2,groundY-footR-SKELETON.footF[1]*s,.15*st);
  }
  for(const k in MUSCLE){
    if(d.armBroken.B&&(k==='elbowB'||k==='handB')||d.armBroken.F&&(k==='elbowF'||k==='handF'))continue; // broken arms dangle
    pull(P[k],P.hip.x+SKELETON[k][0]*s,P.hip.y+SKELETON[k][1]*s,MUSCLE[k]*st);
  }
}

// ---- contacts: which body part touched what, where along it, from which side, how fast ----
// (nx,ny) points from the body part toward what it hit; speed is how fast they closed in (px/step)
function addContact(d,sh,t,nx,ny,speed){
  const o=d.contacts[sh.key];
  if(!o||speed>o.speed)d.contacts[sh.key]={sh,t,nx,ny,speed};
}
// floor and wall hits are caught at the joints; hand each to the part whose skin actually touched
function surfaceContacts(d){
  const P=d.pts;
  for(const sh of SHAPES){
    const A=P[sh.a],B=P[sh.b],r=sh.w*d.s/2;
    if(A===B){if(A.hitSpeed)addContact(d,sh,0,A.nx,A.ny,A.hitSpeed);continue}
    // a thinner part meeting a thicker one at a joint isn't the one touching there
    const ha=A.hitSpeed&&A.r<=r+.01,hb=B.hitSpeed&&B.r<=r+.01;
    if(ha&&hb){ // lying flat along the surface: the hit centres toward the faster end
      const sa=A.hitSpeed,sb=B.hitSpeed;
      addContact(d,sh,clamp01(.5+(sb-sa)/(sa+sb)*.5),A.nx,A.ny,Math.max(sa,sb));
    }else if(ha)addContact(d,sh,.08,A.nx,A.ny,A.hitSpeed);
    else if(hb)addContact(d,sh,.92,B.nx,B.ny,B.hitSpeed);
  }
  for(const p of d.list)p.hitSpeed=0;
}
// closest points between two segments, as fractions along each (Ericson, Real-Time Collision Detection 5.1.9)
function closestSegSeg(p1,q1,p2,q2){
  const d1x=q1.x-p1.x,d1y=q1.y-p1.y,d2x=q2.x-p2.x,d2y=q2.y-p2.y,rx=p1.x-p2.x,ry=p1.y-p2.y;
  const a=d1x*d1x+d1y*d1y,e=d2x*d2x+d2y*d2y,f=d2x*rx+d2y*ry;
  if(a<1e-6&&e<1e-6)return [0,0];
  if(a<1e-6)return [0,clamp01(f/e)];
  const c=d1x*rx+d1y*ry;
  if(e<1e-6)return [clamp01(-c/a),0];
  const b=d1x*d2x+d1y*d2y,den=a*e-b*b;
  let s=den>1e-6?clamp01((b*f-c*e)/den):0,t=(b*s+f)/e;
  if(t<0){t=0;s=clamp01(-c/a)}else if(t>1){t=1;s=clamp01((b-c)/a)}
  return [s,t];
}
// move a capsule's two ends so the spot at fraction s along it moves by (dx,dy)
function shove(A,B,s,dx,dy){
  if(A===B){A.x+=dx;A.y+=dy;return}
  const wa=1-s,wb=s,den=wa*wa+wb*wb;
  A.x+=dx*wa/den;A.y+=dy*wa/den;B.x+=dx*wb/den;B.y+=dy*wb/den;
}
// dummies collide body part against body part, so a shin can hit a belly mid-limb
function collideDummies(){
  for(let i=0;i<dummies.length;i++)for(let j=i+1;j<dummies.length;j++){
    const di=dummies[i],dj=dummies[j];
    if(!boxesTouch(di,dj))continue;
    for(const s1 of SHAPES){
      const A1=di.pts[s1.a],B1=di.pts[s1.b],r1=s1.w*di.s/2;
      for(const s2 of SHAPES){
        const A2=dj.pts[s2.a],B2=dj.pts[s2.b],r2=s2.w*dj.s/2;
        const [s,t]=closestSegSeg(A1,B1,A2,B2);
        const c1x=A1.x+(B1.x-A1.x)*s,c1y=A1.y+(B1.y-A1.y)*s,c2x=A2.x+(B2.x-A2.x)*t,c2y=A2.y+(B2.y-A2.y)*t;
        let dx=c2x-c1x,dy=c2y-c1y,dist=Math.hypot(dx,dy);
        const min=r1+r2;
        if(dist>=min)continue;
        let nx=0,ny=-1;if(dist>1e-6){nx=dx/dist;ny=dy/dist}
        const pen=(min-dist)/2;
        // how fast the two spots were closing in along the line between them
        const v1x=(A1.x-A1.px)*(1-s)+(B1.x-B1.px)*s,v1y=(A1.y-A1.py)*(1-s)+(B1.y-B1.py)*s;
        const v2x=(A2.x-A2.px)*(1-t)+(B2.x-B2.px)*t,v2y=(A2.y-A2.py)*(1-t)+(B2.y-B2.py)*t;
        const closing=(v1x-v2x)*nx+(v1y-v2y)*ny;
        shove(A1,B1,s,-nx*pen,-ny*pen);shove(A2,B2,t,nx*pen,ny*pen);
        if(closing>0){addContact(di,s1,s,nx,ny,closing);addContact(dj,s2,t,-nx,-ny,closing)}
      }
    }
  }
}
function boxesTouch(a,b){
  let ax0=1e9,ax1=-1e9,ay0=1e9,ay1=-1e9,bx0=1e9,bx1=-1e9,by0=1e9,by1=-1e9;
  for(const p of a.list){ax0=Math.min(ax0,p.x-p.r);ax1=Math.max(ax1,p.x+p.r);ay0=Math.min(ay0,p.y-p.r);ay1=Math.max(ay1,p.y+p.r)}
  for(const p of b.list){bx0=Math.min(bx0,p.x-p.r);bx1=Math.max(bx1,p.x+p.r);by0=Math.min(by0,p.y-p.r);by1=Math.max(by1,p.y+p.r)}
  return ax0<bx1&&bx0<ax1&&ay0<by1&&by0<ay1;
}

// ---- damage ----
const IMPACT=14;  // closing speed (px/step) before a hit hurts; small drops and bumps are harmless
const CUT=16;     // damage at which the skin splits as well as bruising
const KO_HIT=22;  // damage that knocks a dummy out cold (head hits need less)
// falls over but stays awake; gets up when recover runs out
function loseBalance(d,frames){d.strength=0;d.recover=Math.max(d.recover,frames)}
function knockOut(d,frames){loseBalance(d,frames);d.ko=true}
function die(d){d.health=0;d.dead=true;d.strength=0;d.ko=true}
const angDiff=(a,b)=>Math.abs(Math.atan2(Math.sin(a-b),Math.cos(a-b)));
// the exact spot on the skin that took the hit
function contactPoint(d,c){
  const sh=c.sh,A=d.pts[sh.a],B=d.pts[sh.b],r=sh.key==='head'?A.r:sh.w*d.s/2;
  return {x:A.x+(B.x-A.x)*c.t+c.nx*r,y:A.y+(B.y-A.y)*c.t+c.ny*r};
}
// injuries are kept in the body part's own frame (along it, and which side) so they move with it
function spotFrame(d,sh,t,nx,ny){
  if(sh.key==='head'){const h=d.pts.head,n=d.pts.neck;return {ang:Math.atan2(ny,nx)-Math.atan2(h.y-n.y,h.x-n.x)}}
  const A=d.pts[sh.a],B=d.pts[sh.b],dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy)||1;
  return {t:Math.min(.94,Math.max(.06,t)),side:(nx*-dy+ny*dx)/len}; // side: -1..1 across the limb
}
function spotPos(d,sp){
  if(sp.key==='head'){
    const h=d.pts.head,n=d.pts.neck,a=Math.atan2(h.y-n.y,h.x-n.x)+sp.ang;
    return {x:h.x+Math.cos(a)*h.r*.62,y:h.y+Math.sin(a)*h.r*.62,ang:a+Math.PI/2};
  }
  const sh=SHAPE_BY_KEY[sp.key],A=d.pts[sh.a],B=d.pts[sh.b],dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy)||1;
  const off=sp.side*sh.w*d.s/2*.55;
  return {x:A.x+dx*sp.t-dy/len*off,y:A.y+dy*sp.t+dx/len*off,ang:Math.atan2(dy,dx)};
}
// every hit bruises where it lands; hard ones split the skin there too, and that cut bleeds
function hurtAt(d,c,dmg){
  const sh=c.sh,f=spotFrame(d,sh,c.t,c.nx,c.ny),cut=dmg>=CUT;
  // the same spot hit again gets worse instead of a new mark appearing next to it
  let sp=d.spots.find(o=>o.key===sh.key&&(sh.key==='head'?angDiff(o.ang,f.ang)<.5:Math.abs(o.t-f.t)<.14&&Math.abs(o.side-f.side)<.8));
  if(!sp){sp={key:sh.key,...f,bruise:0,cut:0,bleed:0,age:0};d.spots.push(sp);if(d.spots.length>40)d.spots.shift()}
  sp.bruise=Math.min(1.5,sp.bruise+dmg/28);sp.age=Math.min(sp.age,30);
  const {x,y}=contactPoint(d,c);
  if(cut){
    sp.cut=Math.min(1.2,sp.cut+dmg/40);sp.bleed=Math.min(1,sp.bleed+dmg*.012);
    spray(x,y,c.nx,c.ny,dmg,d.s);
  }
  thud(Math.min(.9,.2+dmg/40),cut);
  if(dmg>=KO_HIT)shake=Math.max(shake,Math.min(9,dmg*.25));
  if(sh.key!=='head'){
    d.partDmg[sh.key]=(d.partDmg[sh.key]||0)+dmg;
    if(d.partDmg[sh.key]>45){
      if(/knee|foot/.test(sh.key))d.legBroken=true;
      if(/elbowB|handB/.test(sh.key))d.armBroken.B=true;
      if(/elbowF|handF/.test(sh.key))d.armBroken.F=true;
    }
  }
  if(d.dead)return;
  d.health-=dmg;d.hpShow=150;
  if(dmg>=KO_HIT||sh.key==='head'&&dmg>=15)knockOut(d,Math.min(420,90+dmg*5));
  else if(dmg>=6)loseBalance(d,50);
  if(d.health<=0)die(d);
}
// each step: the worst hit hurts, cuts bleed, knockdowns, and getting back up
function updateDummy(d,grabbed){
  const P=d.pts;
  let jolt=0;
  for(const p of [P.hip,P.neck,P.head]){
    const vx=p.x-p.px,vy=p.y-p.py;
    jolt=Math.max(jolt,Math.hypot(vx-p.vx,vy-p.vy));p.vx=vx;p.vy=vy;
  }
  let best=null,bestDmg=0,loudest=0;
  for(const k in d.contacts){
    const c=d.contacts[k];loudest=Math.max(loudest,c.speed);
    if(c.speed<=IMPACT)continue;
    const dmg=Math.min(35,(c.speed-IMPACT)*1.4)*c.sh.tough;
    if(dmg>bestDmg){bestDmg=dmg;best=c}
  }
  d.contacts={};
  if(d.hurtCool>0)d.hurtCool--;
  if(best){
    // bounces right after a hit only add what goes beyond it, so one throw can't stack up a kill
    const extra=d.hurtCool>0?bestDmg-d.lastDmg:bestDmg;
    if(extra>2){hurtAt(d,best,extra);d.lastDmg=d.hurtCool>0?Math.max(d.lastDmg,bestDmg):bestDmg}
    d.hurtCool=12;
  }else if(loudest>7)thud(Math.min(.22,(loudest-7)*.03),false); // harmless bump
  // cuts drip and drain health until they clot
  let bleed=0;
  for(const sp of d.spots){
    sp.age++;
    if(sp.bleed>.01){bleed+=sp.bleed;if(Math.random()<sp.bleed*.25)drip(d,sp);sp.bleed*=d.dead?.996:.998}
  }
  if(bleed&&!d.dead){d.health-=bleed*.012;if(d.health<=0)die(d)}
  if(d.hpShow>0)d.hpShow--;
  if(d.blink--<-7)d.blink=rnd(90,300);
  if(d.dead){d.strength=0;return}
  if(!grabbed){
    // a hard landing or a big jolt makes it fall over, still awake
    const footY=groundY-P.footF.r-2;
    const landing=(P.footB.y>footY||P.footF.y>footY)&&P.hip.vy>11;
    if(jolt>KNOCKDOWN||landing)loseBalance(d,60);
  }
  if(d.recover>0){d.recover--;return}
  d.ko=false; // eyes open, starts getting up
  // held in your hand it stays awake and keeps some muscle tone instead of going limp
  const cap=grabbed?.5:1;
  if(!d.legBroken||grabbed)d.strength=Math.min(cap,d.strength+.012);
  if(d.strength>cap)d.strength=cap;
}

// ---- blood ----
let drops=[],splats=[],wallSplats=[],shake=0;
const BLOOD=['#a5121d','#8c0d16','#c21b26'];
// blood bursts out of the hit spot, away from whatever was hit
function spray(x,y,nx,ny,dmg,s){
  const n=Math.min(34,6+dmg*.8|0),tx=-ny,ty=nx;
  for(let i=0;i<n;i++){
    const out=rnd(1,5),side=rnd(-3.5,3.5);
    drops.push({x:x-nx*2,y:y-ny*2,vx:-nx*out+tx*side,vy:-ny*out+ty*side-rnd(0,2.5),r:rnd(.7,1.6)*s,c:BLOOD[i%3]});
  }
}
function drip(d,sp){
  const {x,y}=spotPos(d,sp);
  drops.push({x,y,vx:rnd(-.4,.4),vy:rnd(0,1),r:rnd(.7,1.3)*d.s,c:BLOOD[Math.random()*3|0]});
}
function updateBlood(){
  for(const q of drops){
    q.vy+=GRAVITY*.8;q.x+=q.vx;q.y+=q.vy;
    if(q.y>=groundY){ // lands as a puddle on the floor
      splats.push({x:q.x,w:q.r*rnd(1.6,3.2),h:q.r*rnd(.45,.8),c:q.c});q.dead=true;
    }else if(q.x<=0||q.x>=VW){ // or a streak on the wall
      wallSplats.push({x:q.x<=0?0:VW,y:q.y,w:q.r*rnd(.5,.8),h:q.r*rnd(1.4,3),c:q.c});q.dead=true;
    }
  }
  drops=drops.filter(q=>!q.dead);
  if(drops.length>700)drops.splice(0,drops.length-700);
  if(splats.length>500)splats.splice(0,splats.length-500);
  if(wallSplats.length>300)wallSplats.splice(0,wallSplats.length-300);
}

// ---- sound: a soft thud for bumps, a heavier one with a wet slap for cuts ----
let ac=null,noise=null,lastSound=0,muted=false;
try{muted=localStorage.getItem('dummy-yard-muted')==='1'}catch(e){}
function unlockAudio(){
  if(!ac){
    try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
    const len=Math.floor(ac.sampleRate*.1);noise=ac.createBuffer(1,len,ac.sampleRate);
    const ch=noise.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len)**2;
  }
  if(ac.state==='suspended')ac.resume();
}
function thud(vol,wet){
  if(muted||!ac||vol<.01)return;
  const now=ac.currentTime;if(now-lastSound<.035)return;lastSound=now;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.setValueAtTime(105+rnd(-15,15),now);o.frequency.exponentialRampToValueAtTime(40,now+.14);
  g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.001,now+.18);
  o.connect(g).connect(ac.destination);o.start(now);o.stop(now+.2);
  const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g2=ac.createGain();
  src.buffer=noise;f.type=wet?'bandpass':'lowpass';f.frequency.value=wet?1000:650;g2.gain.value=vol*(wet?1.3:.7);
  src.connect(f).connect(g2).connect(ac.destination);src.start(now);
}

function integrate(p){
  let vx=(p.x-p.px)*DAMP,vy=(p.y-p.py)*DAMP;
  const max=45;vx=Math.max(-max,Math.min(max,vx));vy=Math.max(-max,Math.min(max,vy));
  p.px=p.x;p.py=p.y;
  p.x+=vx;p.y+=vy+GRAVITY;
}
// floor and walls; remembers how fast each joint hit them
function bounds(p){
  if(p.y>groundY-p.r){
    p.hitSpeed=Math.max(p.hitSpeed,p.y-p.py,.001);p.nx=0;p.ny=1;
    p.y=groundY-p.r;
    p.px=p.x-(p.x-p.px)*.75; // ground friction
    if(p.py<p.y)p.py=p.y;     // no bounce
  }
  if(p.x<p.r){p.hitSpeed=Math.max(p.hitSpeed,p.px-p.x,.001);p.nx=-1;p.ny=0;p.x=p.r;p.px=p.x+(p.x-p.px)*-.3}
  if(p.x>VW-p.r){p.hitSpeed=Math.max(p.hitSpeed,p.x-p.px,.001);p.nx=1;p.ny=0;p.x=VW-p.r;p.px=p.x+(p.x-p.px)*-.3}
}
function solveStick(st){
  const a=st.a,b=st.b,dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001;
  if(st.type==='min'&&d>=st.len)return;
  const diff=(d-st.len)/d*.5*(st.stiff||1);
  const ox=dx*diff,oy=dy*diff;
  a.x+=ox;a.y+=oy;b.x-=ox;b.y-=oy;
}
// a grabbed body part is pinned to the finger at the spot where it was touched
function holdGrabs(){
  for(const g of grabs.values()){
    const {a,b,t}=g;
    shove(a,b,t,g.tx-(a.x+(b.x-a.x)*t),g.ty-(a.y+(b.y-a.y)*t));
  }
}
function step(){
  for(const d of dummies){for(const p of d.list)integrate(p);balance(d)}
  for(let k=0;k<ITER;k++){
    for(const d of dummies){for(const st of d.sticks)solveStick(st);for(const p of d.list)bounds(p)}
    if(k%3===0)collideDummies();
    holdGrabs(); // last, so the held part stays right under the finger
  }
  const held=new Set([...grabs.values()].map(g=>g.d));
  for(const d of dummies){surfaceContacts(d);updateDummy(d,held.has(d))}
  updateBlood();
}

// ---- drawing ----
function limb(a,b,w,fill){
  ctx.lineCap='round';
  ctx.strokeStyle=COL.outline;ctx.lineWidth=w+2.5;
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  ctx.strokeStyle=fill;ctx.lineWidth=w;
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
}
function jointDot(p,r){ctx.fillStyle=COL.joint;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill()}
// outline of a limb (a capsule) or the head, used to keep injuries painted on the skin
function partPath(a,b,half){
  ctx.beginPath();
  if(a===b){ctx.arc(a.x,a.y,a.r,0,Math.PI*2);return}
  const ang=Math.atan2(b.y-a.y,b.x-a.x);
  ctx.arc(b.x,b.y,half,ang-Math.PI/2,ang+Math.PI/2);
  ctx.arc(a.x,a.y,half,ang+Math.PI/2,ang+Math.PI*1.5);
  ctx.closePath();
}
function drawSpots(d,sh,A,B,half){
  const list=d.spots.filter(o=>o.key===sh.key);
  if(!list.length)return;
  ctx.save();partPath(A,B,half);ctx.clip();
  for(const sp of list){
    const {x,y,ang}=spotPos(d,sp),base=sh.key==='head'?A.r*.55:half;
    if(sp.bruise>0){ // fresh red, darkening to purple over a few seconds
      const k=Math.min(1,sp.age/240),r=165-70*k|0,g=55-5*k|0,b=75+45*k|0;
      const R=base*(.55+.4*Math.min(1.2,sp.bruise)),a=.3+.35*Math.min(1,sp.bruise);
      const gr=ctx.createRadialGradient(x,y,0,x,y,R);
      gr.addColorStop(0,`rgba(${r},${g},${b},${a})`);gr.addColorStop(.6,`rgba(${r},${g},${b},${a*.6})`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,R,0,Math.PI*2);ctx.fill();
    }
    if(sp.cut>0){ // a gash running along the skin, wet while it still bleeds
      const L=base*(.4+.45*Math.min(1,sp.cut)),W=Math.max(1,base*(.12+.12*Math.min(1,sp.cut)));
      ctx.save();ctx.translate(x,y);ctx.rotate(ang);
      ctx.fillStyle='#5c0910';ctx.beginPath();ctx.ellipse(0,0,L,W*1.5,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#b3141e';ctx.beginPath();ctx.ellipse(0,0,L*.8,W*.8,0,0,Math.PI*2);ctx.fill();
      if(sp.bleed>.05){ctx.fillStyle='rgba(255,140,140,.45)';ctx.beginPath();ctx.ellipse(-L*.25,-W*.3,L*.25,W*.3,0,0,Math.PI*2);ctx.fill()}
      ctx.restore();
    }
  }
  ctx.restore();
}
// eyes look toward the side the dummy faces; closed when knocked out or dead
function drawEyes(d){
  const h=d.pts.head,n=d.pts.neck,r=h.r;
  const ux=h.x-n.x,uy=h.y-n.y,ul=Math.hypot(ux,uy)||1;
  const upx=ux/ul,upy=uy/ul,rx=-upy*d.face,ry=upx*d.face; // head's "up" and "forward"
  const closed=d.ko||d.dead||d.blink<0;
  ctx.strokeStyle=ctx.fillStyle='#2b3138';ctx.lineCap='round';ctx.lineWidth=Math.max(1.2,r*.12);
  for(const off of [.08,.52]){
    const ex=h.x+rx*off*r+upx*.12*r,ey=h.y+ry*off*r+upy*.12*r;
    ctx.beginPath();
    if(closed){ // a short lid line across the eye
      ctx.moveTo(ex-rx*r*.13,ey-ry*r*.13);ctx.lineTo(ex+rx*r*.13,ey+ry*r*.13);ctx.stroke();
    }else{
      ctx.ellipse(ex,ey,r*.11,r*.18,Math.atan2(upy,upx)+Math.PI/2,0,Math.PI*2);ctx.fill();
    }
  }
}
function drawHealth(d){
  if(d.hpShow<=0||d.dead)return;
  const h=d.pts.head,w=40,x=h.x-w/2,y=h.y-h.r-14;
  ctx.globalAlpha=Math.min(1,d.hpShow/30);
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(x-1,y-1,w+2,6);
  ctx.fillStyle=d.health>50?'#6cc24a':d.health>25?'#f2b544':'#e5533d';
  ctx.fillRect(x,y,w*d.health/100,4);
  ctx.globalAlpha=1;
}
function drawDummy(d){
  const P=d.pts,s=d.s;
  for(const sh of SHAPES){
    const A=P[sh.a],B=P[sh.b];
    if(sh.key==='head'){
      ctx.fillStyle=COL.outline;ctx.beginPath();ctx.arc(A.x,A.y,A.r+1.25,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=COL.body;ctx.beginPath();ctx.arc(A.x,A.y,A.r,0,Math.PI*2);ctx.fill();
      drawSpots(d,sh,A,A,A.r);drawEyes(d);
      continue;
    }
    limb(A,B,sh.w*s,sh.back?COL.bodyBack:COL.body);
    drawSpots(d,sh,A,B,sh.w*s/2);
    if(sh.b==='footF')jointDot(P.kneeF,1.6*s);
    if(sh.b==='handF')jointDot(P.elbowF,1.4*s);
  }
}
// glow around the body part a finger is holding
function drawGrab(g){
  const s=g.d.s;
  ctx.globalAlpha=.45;ctx.strokeStyle=COL.grab;ctx.lineCap='round';
  if(g.a===g.b){
    ctx.lineWidth=4;ctx.beginPath();ctx.arc(g.a.x,g.a.y,g.a.r+4,0,Math.PI*2);ctx.stroke();
  }else{
    ctx.lineWidth=g.w*s+8;ctx.beginPath();ctx.moveTo(g.a.x,g.a.y);ctx.lineTo(g.b.x,g.b.y);ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=COL.sky;ctx.fillRect(0,0,VW,VH);
  // a hard hit shakes the view for a moment
  if(shake>.3){ctx.translate(rnd(-shake,shake),rnd(-shake,shake));shake*=.85}else shake=0;
  ctx.strokeStyle=COL.grid;ctx.lineWidth=1;ctx.beginPath();
  for(let x=40;x<VW;x+=40){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,groundY)}
  for(let y=groundY-40;y>0;y-=40){ctx.moveTo(0,y+.5);ctx.lineTo(VW,y+.5)}
  ctx.stroke();
  ctx.fillStyle=COL.ground;ctx.fillRect(0,groundY,VW,VH-groundY);
  ctx.fillStyle=COL.groundTop;ctx.fillRect(0,groundY,VW,3);
  for(const sp of splats){ctx.fillStyle=sp.c;ctx.beginPath();ctx.ellipse(sp.x,groundY+1,sp.w,sp.h,0,0,Math.PI*2);ctx.fill()}
  for(const sp of wallSplats){ctx.fillStyle=sp.c;ctx.beginPath();ctx.ellipse(sp.x,sp.y,sp.w,sp.h,0,0,Math.PI*2);ctx.fill()}
  for(const d of dummies)drawDummy(d);
  for(const q of drops){ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill()}
  for(const g of grabs.values())drawGrab(g);
  for(const d of dummies)drawHealth(d);
}

// ---- sizing ----
function fit(){
  const r=stage.getBoundingClientRect();
  const ow=VW,oh=VH;
  VW=r.width;VH=r.height;dpr=Math.min(2,devicePixelRatio||1);
  cv.width=Math.round(VW*dpr);cv.height=Math.round(VH*dpr);
  groundY=VH-GROUND_H;
  // keep dummies standing on the ground when the screen rotates
  if(oh&&oh!==VH){const dy=(VH-oh);for(const d of dummies)for(const p of d.list){p.y+=dy;p.py+=dy}}
  if(ow&&ow!==VW){for(const d of dummies)for(const p of d.list){p.x=Math.min(p.x,VW-p.r);p.px=Math.min(p.px,VW-p.r)}}
}

// ---- tools ----
const ICON={
  hand:'<svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="4" fill="#e8ebee"/><path d="M15 3l3 4h-6zM15 27l-3-4h6zM3 15l4-3v6zM27 15l-4 3v-6z" fill="#8d98a3"/></svg>',
  dummy:'<svg viewBox="0 0 30 30" stroke-linecap="round" fill="none"><g stroke="#5d6670" stroke-width="6.5"><path d="M15 9v9M15 11l-5 6M15 11l5 6M15 18l-4 8M15 18l4 8"/></g><g stroke="#dfe2e5" stroke-width="4"><path d="M15 9v9M15 11l-5 6M15 11l5 6M15 18l-4 8M15 18l4 8"/></g><circle cx="15" cy="5.5" r="3.6" fill="#dfe2e5" stroke="#5d6670" stroke-width="1.2"/></svg>',
  remove:'<svg viewBox="0 0 30 30"><path d="M12 5h6l1 2h5v2.5H6V7h5zM8 11h14l-1.2 14H9.2z" fill="#ff8a6a"/></svg>',
};
ICON.heal='<svg viewBox="0 0 30 30"><path d="M12 6h6v6h6v6h-6v6h-6v-6H6v-6h6z" fill="#6cc24a"/></svg>';
const TOOLS=[{id:'hand',label:'Hand'},{id:'dummy',label:'Dummy'},{id:'heal',label:'Heal'},{id:'remove',label:'Delete'}];
let tool='hand';
const tray=document.getElementById('tray');
for(const t of TOOLS){
  const b=document.createElement('button');
  b.className='chip';b.id='tool-'+t.id;b.setAttribute('aria-pressed',t.id===tool);
  b.innerHTML=ICON[t.id]+'<span>'+t.label+'</span>';
  b.addEventListener('click',()=>{
    tool=t.id;tray.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b));
    if(t.id==='dummy')say('Tap anywhere to drop a dummy',2500);
  });
  tray.append(b);
}

// the body part under a fingertip, and how far along it the finger landed.
// When parts overlap, the one drawn on top wins; otherwise the nearest within reach.
function pick(x,y){
  let top=null,best=null,bd=14; // forgiving reach for fingers
  for(const d of dummies)for(const [ka,kb,w] of PARTS){
    const a=d.pts[ka],b=d.pts[kb];
    let t=0,gap;
    if(a===b)gap=Math.hypot(x-a.x,y-a.y)-a.r;
    else{
      const dx=b.x-a.x,dy=b.y-a.y;
      t=Math.max(0,Math.min(1,((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy)));
      gap=Math.hypot(x-a.x-dx*t,y-a.y-dy*t)-w*d.s/2;
    }
    if(gap<=0)top={d,a,b,t,w}; // later parts are drawn in front
    else if(gap<bd){bd=gap;best={d,a,b,t,w}}
  }
  return top||best;
}
const grabs=new Map();
const pos=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();unlockAudio(); // browsers only allow sound after a touch
  const {x,y}=pos(e);
  if(tool==='dummy'){
    const s=scale();
    makeDummy(x,Math.min(y,groundY-(SKELETON.footF[1]+RADIUS.footF)*s));
    return;
  }
  const hit=pick(x,y);
  if(!hit)return;
  if(tool==='remove'){dummies=dummies.filter(d=>d!==hit.d);for(const [id,g] of grabs)if(g.d===hit.d)grabs.delete(id);return}
  if(tool==='heal'){heal(hit.d);hit.d.recover=0;hit.d.hpShow=90;say('Healed',1200);return}
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  grabs.set(e.pointerId,{...hit,tx:x,ty:y});
});
cv.addEventListener('pointermove',e=>{
  const g=grabs.get(e.pointerId);if(!g)return;
  const {x,y}=pos(e);g.tx=x;g.ty=Math.min(y,groundY-4);
});
const release=e=>grabs.delete(e.pointerId);
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

// ---- top bar ----
let paused=false,slow=false;
const ICON_PAUSE='<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
const ICON_PLAY='<svg viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg>';
const ICON_TRASH='<svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4zM6 9h12l-1 12H7z"/></svg>';
const pauseBtn=document.getElementById('pauseBtn'),pausedTag=document.getElementById('pausedTag');
function showPause(){pauseBtn.innerHTML=paused?ICON_PLAY:ICON_PAUSE;pauseBtn.setAttribute('aria-label',paused?'Play':'Pause');pausedTag.hidden=!paused}
pauseBtn.addEventListener('click',()=>{paused=!paused;showPause()});showPause();
const soundBtn=document.getElementById('soundBtn');
const ICON_SOUND='<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const ICON_MUTED='<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function showSound(){soundBtn.innerHTML=muted?ICON_MUTED:ICON_SOUND;soundBtn.setAttribute('aria-label',muted?'Turn sound on':'Turn sound off')}
soundBtn.addEventListener('click',()=>{
  muted=!muted;unlockAudio();showSound();
  try{localStorage.setItem('dummy-yard-muted',muted?'1':'0')}catch(e){}
});showSound();
const slowBtn=document.getElementById('slowBtn');
slowBtn.addEventListener('click',()=>{slow=!slow;slowBtn.textContent=slow?'¼×':'1×'});
const clearBtn=document.getElementById('clearBtn');let armed=0;
function showClear(){clearBtn.innerHTML=armed?'Tap to clear':ICON_TRASH;clearBtn.classList.toggle('warn',!!armed)}
clearBtn.addEventListener('click',()=>{
  if(armed){clearTimeout(armed);armed=0;dummies=[];drops=[];splats=[];wallSplats=[];grabs.clear()}
  else armed=setTimeout(()=>{armed=0;showClear()},2500);
  showClear();
});showClear();

// ---- messages ----
const toast=document.getElementById('toast');
function say(msg,ms){toast.textContent=msg;toast.hidden=false;clearTimeout(say.t);say.t=setTimeout(()=>{toast.hidden=true},ms)}

// ---- loop: fixed 60 steps a second ----
let last=performance.now(),acc=0,slowTick=0;
function frame(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){
    acc-=1000/60;
    if(!paused&&(!slow||(slowTick++%4===0)))step()
  }
  draw();
  requestAnimationFrame(frame);
}
fit();
new ResizeObserver(fit).observe(stage);
makeDummy(VW*.5,groundY-(SKELETON.footF[1]+RADIUS.footF)*scale()); // standing on the ground
window.__yard={dummies:()=>dummies,groundY:()=>groundY,pick,blood:()=>({drops:drops.length,splats:splats.length,wall:wallSplats.length}),SHAPES}; // for testing from the console
requestAnimationFrame(frame);

// cache the game on the device so it opens with no connection
if('serviceWorker' in navigator){
  addEventListener('load',async()=>{
    try{
      await navigator.serviceWorker.register('sw.js');
      await navigator.serviceWorker.ready;
      const saved=await caches.match('./index.html');
      if(saved)say('✓ Ready to play offline',3000);
      else say('Not saved for offline yet. Open it once with internet.',7000);
    }catch(e){say('Not saved for offline yet. Open it once with internet.',7000)}
  });
}
})();
</script>
